<!DOCTYPE html>
<html lang="en" data-bs-theme="light"> <!-- default theme -->
<head>
  <meta charset="UTF-8">
  <title>Analytics Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-body">

<div class="container mt-4">
  <!-- Theme toggle + navigation -->
  <div class="d-flex justify-content-end mb-3">
    <button id="themeToggle" class="btn btn-sm btn-outline-secondary me-2">🌙 Dark</button>
    <a href="/logout" class="btn btn-outline-danger">Logout</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h2 class="card-title mb-4">Analytics Dashboard</h2>

      <!-- Stats -->
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="alert alert-info">
            <strong>Total Candidates:</strong> {{ total }}
          </div>
        </div>
        <div class="col-md-6">
          <div class="alert alert-success">
            <strong>Average Score:</strong> {{ avg }}
          </div>
        </div>
      </div>

      <!-- Chart -->
      <canvas id="chart" height="120"></canvas>
    </div>
  </div>

  <div class="mt-3">
    <a href="/" class="btn btn-outline-primary me-2">Back to Home</a>
  </div>
</div>

<!-- Scores data -->
<script id="scores-data" type="application/json">
  {{ scores|tojson }}
</script>

<script>
const scores = JSON.parse(document.getElementById("scores-data").textContent);

new Chart(document.getElementById("chart"), {
  type: "bar",
  data: {
    labels: scores.map(s => s.filename),
    datasets: [{
      label: "Scores (%)",
      data: scores.map(s => s.score * 100),
      backgroundColor: "rgba(75, 192, 192, 0.6)",
      borderColor: "rgba(75, 192, 192, 1)",
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins: {
      title: { display: true, text: "Candidate Scores" },
      legend: { display: false }
    },
    scales: {
      y: { beginAtZero: true, title: { display: true, text: "Score (%)" } }
    }
  }
});

// Dark/Light theme toggle with persistence
const toggleBtn = document.getElementById("themeToggle");
const html = document.documentElement;

// Load saved theme on page load
const savedTheme = localStorage.getItem("theme");
if (savedTheme) {
  html.setAttribute("data-bs-theme", savedTheme);
  toggleBtn.textContent = savedTheme === "light" ? "🌙 Dark" : "☀️ Light";
}

// Toggle theme on click
toggleBtn.addEventListener("click", () => {
  const currentTheme = html.getAttribute("data-bs-theme");
  const newTheme = currentTheme === "light" ? "dark" : "light";
  html.setAttribute("data-bs-theme", newTheme);
  localStorage.setItem("theme", newTheme); // save choice
  toggleBtn.textContent = newTheme === "light" ? "🌙 Dark" : "☀️ Light";
});
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
